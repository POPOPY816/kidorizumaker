<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木材最適カット計算 — 単一HTML版</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
  background: #f7f7f7;
}
h1 { font-size: 24px; }
input, select, button {
  font-size: 16px;
  padding: 6px;
  margin: 4px;
}
textarea { width: 100%; height: 180px; }
.sheetBox {
  border: 2px solid #333;
  background: #fff;
  margin: 20px 0;
}
.statsBox {
  background: #fff;
  padding: 12px;
  border: 1px solid #ccc;
  margin-top: 20px;
  width: 360px;
}
</style>
</head>
<body>

<h1>木材最適カット計算</h1>

<div>
  <label>シート幅(mm): <input id="sheetW" value="910"></label>
  <label>シート長(mm): <input id="sheetH" value="1820"></label>
</div>

<div>
  <label>ケルフ(mm): <input id="kerf" value="3"></label>
  <label>シャッフル:
    <select id="shuffleMode">
      <option value="none">なし</option>
      <option value="seed1">1</option>
      <option value="seed2">2</option>
      <option value="seed3">3</option>
    </select>
  </label>
</div>

<textarea id="csvInput">パーツA,200,300,2
パーツB,450,300,1
パーツC,300,200,3</textarea>

<br>
<button id="calcBtn">計算</button>
<button id="pdfBtn">PDF出力</button>

<div id="resultArea"></div>
<div id="statsArea"></div>

<script>
function parseCSV(txt){
  return txt.trim().split(/\n/).map(l=>{
    const c=l.split(",");
    return {name:c[0],w:+c[1],h:+c[2],qty:+c[3]};
  });
}

function planLayout(parts, W, H, kerf){
  let items=[];
  parts.forEach(p=>{for(let i=0;i<p.qty;i++)items.push({...p});});
  let sheets=[{rects:[]}];
  let x=0,y=0,rowH=0;

  for(const it of items){
    if(x+it.w>W){
      x=0; y+=rowH+kerf; rowH=0;
    }
    if(y+it.h>H){
      sheets.push({rects:[]});
      x=0;y=0;rowH=0;
    }
    sheets.at(-1).rects.push({x,y,w:it.w,h:it.h,name:it.name});
    x+=it.w+kerf;
    rowH=Math.max(rowH,it.h);
  }
  return {sheets,workW:W,workH:H};
}

function renderSheets(r){
  return r.sheets.map((s,i)=>`
    <div class="sheetBox">
      <h3>シート #${i+1}</h3>
      <svg width="${r.workW}" height="${r.workH}">
        ${s.rects.map(o=>`
          <rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"
            fill="#cce" stroke="#33f" stroke-width="2"/>
          <text x="${o.x+4}" y="${o.y+14}" font-size="12">
            ${o.name}
          </text>`).join("")}
      </svg>
    </div>`).join("");
}

/* ===== ここだけが修正点 ===== */
function printPDF(result){
  const w = result.workW;
  const h = result.workH;

  let html = `
  <html><head>
  <style>
    @page { size: A4 landscape; margin: 10mm; }
    body { margin:0; font-family:sans-serif; }
    .page {
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    svg {
      transform: rotate(90deg);
      transform-origin: center center;
      max-width: 100%;
      max-height: 100%;
      border:1px solid #000;
      background:#eee;
    }
  </style>
  </head><body>
  `;

  result.sheets.forEach(s=>{
    html+=`<div class="page">
      <svg viewBox="0 0 ${w} ${h}">
        ${s.rects.map(r=>`
          <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
            fill="#cce" stroke="#33f" stroke-width="2"/>
          <text x="${r.x+4}" y="${r.y+14}" font-size="14">${r.name}</text>
        `).join("")}
      </svg>
    </div>`;
  });

  html += `</body></html>`;

  const win = window.open("");
  win.document.write(html);
  win.document.close();
  win.print();
}
/* ===== ここまで ===== */

document.getElementById("calcBtn").onclick=()=>{
  const r=planLayout(
    parseCSV(csvInput.value),
    +sheetW.value,
    +sheetH.value,
    +kerf.value
  );
  resultArea.innerHTML=renderSheets(r);
};

document.getElementById("pdfBtn").onclick=()=>{
  const r=planLayout(
    parseCSV(csvInput.value),
    +sheetW.value,
    +sheetH.value,
    +kerf.value
  );
  printPDF(r);
};
</script>
</body>
</html>
