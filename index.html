<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木取り計算（最適化版）</title>
<style>
body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  margin: 20px;
}
textarea { width: 100%; height: 140px; }
button { padding: 6px 12px; margin-top: 8px; }

.sheet {
  margin: 20px 0;
  border: 2px solid #000;
  padding: 10px;
}

.info {
  margin-bottom: 6px;
  font-size: 14px;
}

.preview svg {
  width: 100%;
  max-width: 900px;
  height: auto;
  border: 1px solid #000;
}
</style>
</head>
<body>

<h2>木取り計算（1枚優先モード付き）</h2>

<div>
  板サイズ：
  <input id="w" type="number" value="1820"> ×
  <input id="h" type="number" value="910"> mm
</div>

<label>
  <input type="checkbox" id="force1" checked>
  1枚に収まるか最大限試す
</label>

<textarea id="csv">
A,200,300,2
B,450,300,1
C,300,200,3
</textarea>

<br>
<button onclick="calc()">表示</button>
<button onclick="pdf()">PDF出力</button>

<div id="view"></div>

<script>
const MARGIN = 10;
const KERF = 4;

function parseCSV(text){
  return text.trim().split(/\n/).map(l=>{
    const p=l.split(",");
    return {
      name:p[0].trim(),
      w:+p[1],
      h:+p[2],
      q:+p[3]
    };
  });
}

function layout(parts,W,H){
  const usableW = W - MARGIN*2;
  const usableH = H - MARGIN*2;
  const forceOne = document.getElementById("force1").checked;

  let items=[];
  parts.forEach(p=>{
    for(let i=0;i<p.q;i++) items.push({...p});
  });

  items.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));

  function tryPack(list){
    let free=[{x:MARGIN,y:MARGIN,w:usableW,h:usableH}];
    let placed=[];

    for(const p of list){
      let ok=false;

      for(let i=0;i<free.length;i++){
        const r=free[i];

        for(const rot of [false,true]){
          const pw=(rot?p.h:p.w)+KERF;
          const ph=(rot?p.w:p.h)+KERF;

          if(pw<=r.w && ph<=r.h){
            placed.push({
              name:p.name,
              w:rot?p.h:p.w,
              h:rot?p.w:p.h,
              x:r.x,
              y:r.y,
              rot
            });

            free.splice(i,1);
            free.push(
              {x:r.x+pw,y:r.y,w:r.w-pw,h:ph},
              {x:r.x,y:r.y+ph,w:r.w,h:r.h-ph}
            );

            ok=true;
            break;
          }
        }
        if(ok) break;
      }

      if(!ok) return null;
    }

    return placed;
  }

  let sheets=[];

  while(items.length){
    let packed=null;

    if(forceOne){
      for(let i=0;i<3 && !packed;i++){
        let test=[...items];
        if(i===1) test.reverse();
        if(i===2) test.sort(()=>Math.random()-0.5);
        packed = tryPack(test);
      }
    }

    if(!packed){
      packed = tryPack(items);
    }

    if(!packed){
      packed = tryPack([items[0]]);
      items.shift();
    }else{
      items.length = 0;
    }

    sheets.push(packed);
  }

  return sheets;
}

function usage(sheet,W,H){
  const area=(W-MARGIN*2)*(H-MARGIN*2);
  const used=sheet.reduce((s,r)=>s+(r.w+KERF)*(r.h+KERF),0);
  return Math.round(used/area*100);
}

function drawSheets(sheets,W,H){
  return sheets.map((s,i)=>`
    <div class="sheet preview">
      <div class="info">
        板${i+1}（${W}×${H}mm） 使用率 ${usage(s,W,H)}%
      </div>
      <svg viewBox="0 0 ${W} ${H}">
        <rect width="${W}" height="${H}" fill="none" stroke="black"/>
        ${s.map(r=>`
          <rect x="${r.x}" y="${r.y}"
            width="${r.w}" height="${r.h}"
            fill="#eee" stroke="black"/>
          <text x="${r.x+6}" y="${r.y+16}" font-size="13">
            ${r.name}${r.rot?"(回転)":""}
          </text>
          <text x="${r.x+6}" y="${r.y+32}" font-size="12">
            ${r.w}×${r.h}
          </text>
        `).join("")}
      </svg>
    </div>
  `).join("");
}

function calc(){
  const W=+w.value;
  const H=+h.value;
  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H);
  view.innerHTML=drawSheets(sheets,W,H);
}

function pdf(){
  const W=+w.value;
  const H=+h.value;
  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H);
  const date=new Date().toLocaleDateString();

  let html=`<html><head>
  <style>
    @page{size:A4 landscape;margin:10mm;}
    body{font-family:sans-serif;}
    .page{page-break-after:always;}
  </style></head><body>`;

  sheets.forEach((s,i)=>{
    html+=`
    <div class="page">
      <div>
        木取り図 ${i+1}枚目（${W}×${H}mm / 使用率${usage(s,W,H)}% / ${date}）
      </div>
      <svg width="277mm" height="190mm" viewBox="0 0 ${W} ${H}">
        <rect width="${W}" height="${H}" fill="none" stroke="black"/>
        ${s.map(r=>`
          <rect x="${r.x}" y="${r.y}"
            width="${r.w}" height="${r.h}"
            fill="#eee" stroke="black"/>
          <text x="${r.x+6}" y="${r.y+16}" font-size="14">
            ${r.name}${r.rot?"(回転)":""}
          </text>
          <text x="${r.x+6}" y="${r.y+32}" font-size="12">
            ${r.w}×${r.h}
          </text>
        `).join("")}
      </svg>
    </div>`;
  });

  html+=`</body></html>`;

  const win=window.open();
  win.document.write(html);
  win.document.close();
  win.print();
}
</script>
</body>
</html>
