<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>木取り図メーカー</title>
  <style>
    :root{
      --bg:#0f1220; --panel:#161a2e; --muted:#2a2f4a; --text:#e7e9f7; --sub:#a9afd4;
      --accent:#5b7cff; --accent-2:#2f6df6;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial
    }
    header{
      padding:12px 16px; background:#121636; border-bottom:1px solid #20264a;
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10
    }
    header .spacer{flex:1}
    h1{margin:0; font-size:16px}

    /* ツールバー：横並び＋改行なし＋横スクロール可 */
    header .menu{
      display:flex; flex-wrap:nowrap; gap:8px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
    }

    .container{display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px}
    @media(max-width:960px){.container{grid-template-columns:1fr}}

    .card{background:var(--panel); border:1px solid var(--muted); border-radius:10px; overflow:hidden}
    .card h2{margin:0; padding:10px 12px; font-size:14px; border-bottom:1px solid var(--muted); color:#c9cff7}
    .content{padding:12px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:8px}
    label{font-size:12px; color:var(--sub); display:block; margin-bottom:4px}

    /* 入力は幅100%、ボタンはauto（改行防止） */
    input,select{
      width:100%; padding:10px 12px; background:#0f1330; border:1px solid var(--muted);
      color:var(--text); border-radius:8px
    }
    button{
      padding:10px 14px; background:#0f1330; border:1px solid var(--muted);
      color:var(--text); border-radius:8px; cursor:pointer
    }
    header .menu button{
      width:auto; white-space:nowrap; min-width:110px; font-size:13px;
    }
    .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-2)); border:1px solid #2a4cf6; color:#fff; font-weight:600}

    table{width:100%; border-collapse:collapse}
    th,td{border-bottom:1px dashed var(--muted); padding:6px 4px; font-size:13px}
    th{color:#c9cff7; text-align:left}
    td input[type="checkbox"]{transform: translateY(2px)}
    #sheets{display:flex; flex-direction:column; gap:12px}

    .hint{margin-top:8px; font-size:12px; color:#a9afd4}
    .stats{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:#c9cff7; padding:8px 0}
    .chip{border:1px solid var(--muted); padding:4px 8px; border-radius:999px; background:#0f1330}

    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

    @media (max-width: 720px){
      header .menu button{ min-width:120px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>木取り図メーカー</h1>
    <div class="spacer" aria-hidden="true"></div>
    <div class="menu" role="toolbar" aria-label="操作メニュー">
      <button id="topAddRow" class="btn" title="部材の行を1つ追加">行を追加</button>
      <button id="topClear" class="btn" title="部材リストを空にする">クリア</button>
      <button id="topImport" class="btn" title="CSVから部材を読み込み">CSV読込</button>
      <button id="topRun" class="btn-primary" title="通常トライでプレビュー">プレビュー</button>
      <button id="topOpt" class="btn" title="探索回数を増やして最良解を探す">最適化</button>
      <button id="topPDF" class="btn" title="PDFで印刷（線のみ・省インク）">PDF印刷</button>
    </div>
    <input id="csvFile" type="file" accept=".csv,text/csv,text/plain" class="sr-only" aria-hidden="true" />
  </header>

  <div class="container">
    <section class="card" aria-labelledby="basic-setting-title">
      <h2 id="basic-setting-title">基本設定</h2>
      <div class="content">
        <div class="row">
          <div>
            <label for="sheetW">原板 幅 (mm)</label>
            <input id="sheetW" inputmode="numeric" type="number" min="1" value="1820" />
          </div>
          <div>
            <label for="sheetH">原板 高さ (mm)</label>
            <input id="sheetH" inputmode="numeric" type="number" min="1" value="910" />
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <div>
            <label for="kerf">ノコ刃厚(ケルフ) (mm)</label>
            <input id="kerf" inputmode="decimal" type="number" min="0" step="0.1" value="3" />
          </div>
          <div>
            <label for="margin">マージン (mm)</label>
            <input id="margin" inputmode="decimal" type="number" min="0" step="0.1" value="5" />
          </div>
        </div>

        <h3 style="margin:14px 0 6px; font-size:13px; color:#c9cff7">部材リスト</h3>
        <div style="max-height:260px; overflow:auto; border:1px solid var(--muted); border-radius:8px" aria-label="部材リスト">
          <table id="partsTable">
            <thead>
              <tr><th>名前</th><th>幅</th><th>高</th><th>数</th><th>回転</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="hint">Enterでセル確定、Ctrl/⌘+Enterで行追加。主要操作は上部メニューにもあります。</div>

        <!-- CSV説明（短縮） -->
        <div style="margin-top:8px; font-size:12px; color:#cbd3ff; border:1px solid var(--muted); padding:8px; background:#121636; border-radius:8px">
          <div style="font-weight:700; margin-bottom:6px; color:#e7e9f7">CSVの列構造（インポート用）</div>
          <div style="line-height:1.7">
            ・列順序：<code>名前, 幅(mm), 高(mm), 数量, 回転可(1=可,0=不可)</code><br/>
            ・1行目はヘッダでもOK（自動スキップ）<br/>
            ・幅/高は数値（mmを付けない）<br/>
            ・回転可は <code>1=可</code> / <code>0=不可</code>
          </div>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="preview-title">
      <h2 id="preview-title">プレビュー</h2>
      <div class="content">
        <div class="stats" id="stats" aria-live="polite"></div>
        <div id="sheets"></div>
      </div>
    </section>
  </div>

  <script>
    // ====== ユーティリティ ======
    const $ = (s,el=document)=>el.querySelector(s);
    const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
    const EPS = 1e-6;

    // ====== 永続化 ======
    const STORAGE_KEY = 'kitorizu:minapp:v4';
    function saveState(){
      const state = {
        sheetW:+$('#sheetW').value, sheetH:+$('#sheetH').value,
        kerf:+$('#kerf').value, margin:+$('#margin').value,
        parts:getPartsFromTable()
      };
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch{}
    }
    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY); if(!raw) return false;
        const s = JSON.parse(raw);
        $('#sheetW').value = s.sheetW ?? 1820;
        $('#sheetH').value = s.sheetH ?? 910;
        $('#kerf').value   = s.kerf   ?? 3;
        $('#margin').value = s.margin ?? 5;
        setPartsTable(Array.isArray(s.parts)&&s.parts.length? s.parts : [{name:'棚板A',w:300,h:200,qty:2,rot:true}]);
        return true;
      }catch{ return false; }
    }

    // ====== 部材テーブル ======
    function addRow(pref={name:'',w:100,h:100,qty:1,rot:true}){
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="name" placeholder="例: 棚板A" value="${escapeHtml(pref.name||'')}"></td>
        <td><input class="w" type="number" inputmode="numeric" min="1" value="${pref.w}"></td>
        <td><input class="h" type="number" inputmode="numeric" min="1" value="${pref.h}"></td>
        <td><input class="qty" type="number" inputmode="numeric" min="1" value="${pref.qty}"></td>
        <td style="text-align:center"><input class="rot" type="checkbox" ${pref.rot?'checked':''} aria-label="回転可"></td>
        <td style="width:1%"><button class="del" title="削除">削除</button></td>`;
      const tbody=$('#partsTable tbody');
      tbody.appendChild(tr);
      $('.del',tr).addEventListener('click',()=>{ tr.remove(); run(); saveState(); });
      $$('input',tr).forEach(inp=>{
        inp.addEventListener('change',()=>{ clampInputs(tr); run(); saveState(); });
        inp.addEventListener('keydown', (e)=>{
          if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ addRow(); run(); saveState(); }
        });
      });
    }
    function clampInputs(tr){
      const w=$('.w',tr), h=$('.h',tr), q=$('.qty',tr);
      w.value = Math.max(1, Math.floor(+w.value||0));
      h.value = Math.max(1, Math.floor(+h.value||0));
      q.value = Math.max(1, Math.floor(+q.value||1));
    }
    function setPartsTable(items){ const tbody=$('#partsTable tbody'); tbody.innerHTML=''; items.forEach(addRow); }
    function getPartsFromTable(){
      return $$('#partsTable tbody tr').map(tr=>({
        name:($('.name',tr).value||'-').trim(),
        w:+$('.w',tr).value||0,
        h:+$('.h',tr).value||0,
        qty:Math.max(1,+$('.qty',tr).value||1),
        rot:$('.rot',tr).checked
      })).filter(p=>p.w>0&&p.h>0&&p.qty>0);
    }

    // ====== レイアウト（多開始ギロチン + 空き領域マージ） ======
    function planLayout(parts, sheetW, sheetH, kerf, margin, opts={}){
      const workW = Math.max(1, sheetW - margin*2);
      const workH = Math.max(1, sheetH - margin*2);
      const K = Math.max(0, kerf||0);

      // 展開
      const base=[]; for(const p of parts){ for(let i=0;i<p.qty;i++) base.push({name:p.name,w:p.w,h:p.h,rot:p.rot}); }

      const orders = [
        {fn:(a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h) || (b.w*b.h)-(a.w*a.h)}, // maxSide
        {fn:(a,b)=>(b.w*b.h)-(a.w*a.h)},                                        // area
        {fn:(a,b)=>b.h-a.h || b.w-a.w},                                         // height
        {fn:(a,b)=>b.w-a.w || b.h-a.h},                                         // width
        {fn:(a,b)=>Math.abs(a.w/a.h-1)-Math.abs(b.w/b.h-1)},                    // square-ish
        {fn:null},                                                              // random
      ];
      const splits = [
        (n,r)=>[{x:n.x+r.w+K,y:n.y,w:n.w-r.w-K,h:r.h},{x:n.x,y:n.y+r.h+K,w:n.w,h:n.h-r.h-K}], // right→down
        (n,r)=>[{x:n.x,y:n.y+r.h+K,w:n.w,h:n.h-r.h-K},{x:n.x+r.w+K,y:n.y,w:n.w-r.w-K,h:r.h}], // down→right
        (n,r)=> (n.w-r.w < n.h-r.h)
               ? [{x:n.x+r.w+K,y:n.y,w:n.w-r.w-K,h:r.h},{x:n.x,y:n.y+r.h+K,w:n.w,h:n.h-r.h-K}]
               : [{x:n.x,y:n.y+r.h+K,w:n.w,h:n.h-r.h-K},{x:n.x+r.w+K,y:n.y,w:n.w-r.w-K,h:r.h}],
      ];

      const tries = Math.max(12, opts.tries || 28);
      let best = null;

      for(let t=0;t<tries;t++){
        const items = base.map(o=>({...o}));
        const ord = orders[t % orders.length];
        if(ord.fn) items.sort(ord.fn); else shuffle(items, 17*t+3);
        const splitFn = splits[t % splits.length];
        const res = pack(items, splitFn);
        if(!best || better(res,best)) best = res;
      }
      return best;

      function pack(items, splitFn){
        const sheets=[]; let s=newSheet(); sheets.push(s);
        for(const it of items){
          if(!placeOnAnySheet(it)){ s=newSheet(); sheets.push(s); if(!place(s,it)) throw new Error(`入らない部材: ${it.name} ${it.w}×${it.h}mm`); }
        }
        const result = {sheets, workW, workH, margin, kerf:K};
        result.waste = totalWaste(result);
        return result;

        function newSheet(){ return {nodes:[{x:0,y:0,w:workW,h:workH}], rects:[]}; }
        function placeOnAnySheet(rect){ for(const sh of sheets){ if(place(sh,rect)) return true; } return false; }

        function place(sheet, rect){
          const orients = rect.rot ? [[rect.w,rect.h],[rect.h,rect.w]] : [[rect.w,rect.h]];
          let bi=-1, bo=null, bs=Infinity;
          for(const [rw,rh] of orients){
            for(let i=0;i<sheet.nodes.length;i++){
              con
