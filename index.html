<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木取り計算（ケルフ対応・完成版）</title>
<style>
body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  margin: 20px;
}

textarea { width: 100%; height: 140px; }
button { padding: 6px 12px; margin-top: 8px; }

.sheet {
  margin: 20px 0;
  border: 2px solid #000;
  padding: 10px;
}

.info {
  margin-bottom: 6px;
  font-size: 14px;
}

.preview svg {
  width: 100%;
  max-width: 900px;
  height: auto;
  border: 1px solid #000;
}
</style>
</head>
<body>

<h2>木取り計算</h2>

<div>
  板サイズ：
  <input id="w" type="number" value="910"> ×
  <input id="h" type="number" value="1820"> mm
</div>

<div>
  余白：
  <input id="margin" type="number" value="10"> mm　
  ケルフ：
  <input id="kerf" type="number" value="3"> mm
</div>

<textarea id="csv">
A,200,300,2
B,450,300,1
C,300,200,3
</textarea>

<br>
<button onclick="calc()">表示</button>
<button onclick="pdf()">PDF出力</button>

<div id="view"></div>

<script>
function parseCSV(text){
  return text.trim().split(/\n/).map(l=>{
    const p=l.split(",");
    if(p.length!==4) return null;
    return {
      name:p[0].trim(),
      w:+p[1],
      h:+p[2],
      q:+p[3]
    };
  }).filter(Boolean);
}

function layout(parts, W, H, margin, kerf){
  let items=[];
  parts.forEach(p=>{
    for(let i=0;i<p.q;i++) items.push({...p});
  });

  items.sort((a,b)=>(b.w*b.h)-(a.w*a.h));

  const usableW = W - margin*2;
  const usableH = H - margin*2;

  let sheets=[[]];
  let x=margin, y=margin, row=0;

  for(const p of items){
    let w=p.w, h=p.h, rot=false;

    if(w>usableW || h>usableH){
      if(h<=usableW && w<=usableH){
        [w,h]=[h,w];
        rot=true;
      }
    }

    if(x + w > margin + usableW){
      x = margin;
      y += row + kerf;
      row = 0;
    }

    if(y + h > margin + usableH){
      sheets.push([]);
      x = margin;
      y = margin;
      row = 0;
    }

    sheets.at(-1).push({ ...p, w, h, x, y, rot });

    x += w + kerf;
    row = Math.max(row, h);
  }

  return sheets;
}

function usage(sheet,W,H,margin){
  const area = (W-2*margin)*(H-2*margin);
  const used = sheet.reduce((s,r)=>s+r.w*r.h,0);
  return Math.round(used/area*100);
}

function drawSheets(sheets,W,H,margin){
  return sheets.map((s,i)=>`
    <div class="sheet preview">
      <div class="info">
        板${i+1}（${W}×${H}mm） 使用率 ${usage(s,W,H,margin)}%
      </div>
      <svg viewBox="0 0 ${W} ${H}">
        <rect width="${W}" height="${H}" fill="none" stroke="black"/>
        <rect x="${margin}" y="${margin}"
              width="${W-2*margin}" height="${H-2*margin}"
              fill="none" stroke="#999" stroke-dasharray="4"/>
        ${s.map(r=>`
          <rect x="${r.x}" y="${r.y}"
                width="${r.w}" height="${r.h}"
                fill="#eee" stroke="black"/>
          <text x="${r.x+6}" y="${r.y+16}" font-size="13">
            ${r.name}${r.rot?"(回転)":""}
          </text>
          <text x="${r.x+6}" y="${r.y+32}" font-size="12">
            ${r.w}×${r.h}
          </text>
        `).join("")}
      </svg>
    </div>
  `).join("");
}

function calc(){
  const W=+w.value;
  const H=+h.value;
  const margin=+margin.value;
  const kerf=+kerf.value;

  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H,margin,kerf);
  view.innerHTML=drawSheets(sheets,W,H,margin);
}

function pdf(){
  const W=+w.value;
  const H=+h.value;
  const margin=+margin.value;
  const kerf=+kerf.value;

  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H,margin,kerf);

  let html=`<html><head>
  <style>
    @page { size:A4 landscape; margin:10mm; }
    body{font-family:sans-serif;}
    .page{page-break-after:always;}
  </style>
  </head><body>`;

  sheets.forEach((s,i)=>{
    html+=`
      <div class="page">
        <div>木取り図 ${i+1}枚目</div>
        <svg width="277mm" height="190mm"
          viewBox="0 0 ${W} ${H}">
          <rect width="${W}" height="${H}" fill="none" stroke="black"/>
          <rect x="${margin}" y="${margin}"
                width="${W-2*margin}" height="${H-2*margin}"
                fill="none" stroke="#999" stroke-dasharray="4"/>
          ${s.map(r=>`
            <rect x="${r.x}" y="${r.y}"
              width="${r.w}" height="${r.h}"
              fill="#eee" stroke="black"/>
            <text x="${r.x+6}" y="${r.y+16}" font-size="14">
              ${r.name}${r.rot?"(回転)":""}
            </text>
            <text x="${r.x+6}" y="${r.y+32}" font-size="12">
              ${r.w}×${r.h}
            </text>
          `).join("")}
        </svg>
      </div>`;
  });

  html+=`</body></html>`;

  const win=window.open();
  win.document.write(html);
  win.document.close();
  win.print();
}
</script>
</body>
</html>
