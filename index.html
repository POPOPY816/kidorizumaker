<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木材最適カット計算 — 単一HTML版（修正版）</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
  background: #f7f7f7;
}
h1 { font-size: 24px; }
input, select, button {
  font-size: 16px;
  padding: 6px;
  margin: 4px;
}
textarea { width: 100%; height: 180px; }
#resultArea { margin-top: 20px; }
.sheetBox {
  border: 2px solid #333;
  background: #fff;
  margin: 20px 0;
  display: inline-block;
  position: relative;
}
.sheetBox svg {
  display: block;
}
.rectLabel {
  font-size: 12px;
  fill: #000;
  pointer-events: none;
}
.statsBox {
  background: #fff;
  padding: 12px;
  border: 1px solid #ccc;
  margin-top: 20px;
  width: 360px;
}
</style>
</head>
<body>

<h1>木材最適カット計算 — 単一HTML版（修正版）</h1>

<div>
  <label>標準シート幅(mm): <input id="sheetW" type="number" value="910"></label>
  <label>標準シート長(mm): <input id="sheetH" type="number" value="1820"></label>
</div>

<div>
  <label>ケルフ（ノコ刃厚, mm）: <input id="kerf" type="number" value="3"></label>
  <label>ランダム配置: 
    <select id="shuffleMode">
      <option value="none">しない</option>
      <option value="seed1">シード1</option>
      <option value="seed2">シード2</option>
      <option value="seed3">シード3</option>
    </select>
  </label>
</div>

<h3>部材CSV（名前,幅,長さ,個数）※区切り文字は自動判定</h3>
<textarea id="csvInput">パーツA,200,300,2
パーツB,450,300,1
パーツC,300,200,3</textarea>

<div>
  <button id="calcBtn">計算する</button>
  <button id="pdfBtn">PDF出力</button>
</div>

<div id="resultArea"></div>
<div id="statsArea"></div>

<!-- --------------------------------------------------------------
     ここから JavaScript（修正版・完全組込み）
-------------------------------------------------------------- -->
<script>
// ----------- 基本ユーティリティ ---------------------------------

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

// 全角数字・ドットなどを半角化
function normalizeNumber(x){
  if(typeof x!=="string") return x;
  const z = x
    .replace(/[０-９]/g, d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))
    .replace(/[．]/g,".")
    .replace(/[，]/g,"")
    .trim();
  return z;
}

// 区切り文字検出（誤判定改善）
function detectDelimiter(sampleLines){
  const cands=[',','\t',';','、','，'];
  let best=',',score=-1;
  for(const c of cands){
    const s = sampleLines.reduce((a,l)=> a + (l.split(c).length - 1), 0);
    if(s>score){ best=c; score=s; }
  }
  const testCols = sampleLines[0].split(best).length;
  if(testCols < 2) return ',';
  return best;
}

// 配列シャッフル（返り値つき）
function shuffle(arr, seed=1){
  let x = seed>>>0 || 1;
  for(let i=arr.length-1;i>0;i--){
    x = (1664525*x + 1013904223) >>> 0;
    const j = x % (i+1);
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// -----------------------------------------------------------------
// CSV 読み込み
// -----------------------------------------------------------------
function parseCSV(txt){
  const lines = txt.split(/\r?\n/).filter(s=>s.trim()!=="");
  if(lines.length===0) return [];

  const dlm = detectDelimiter(lines.slice(0,3));
  const out = [];

  for(const line of lines){
    const cols = line.split(dlm).map(c=>c.trim());
    if(cols.length<4) continue;
    const name = cols[0];
    const w = Number(normalizeNumber(cols[1]));
    const h = Number(normalizeNumber(cols[2]));
    const qty = Number(normalizeNumber(cols[3]));
    if(!isFinite(w)||!isFinite(h)||!isFinite(qty)) continue;
    out.push({name,w,h,qty});
  }
  return out;
}

// -----------------------------------------------------------------
// 配置アルゴリズム（簡易棚積み）
// -----------------------------------------------------------------
function planLayout(parts, sheetW, sheetH, kerf, shuffleMode){
  let items =[];
  for(const p of parts){
    for(let i=0;i<p.qty;i++){
      items.push({name:p.name,w:p.w,h:p.h});
    }
  }

  // 面積大 → 幅大の順でソート
  items.sort((a,b)=> (b.w*b.h - a.w*a.h) || (Math.max(b.w,b.h) - Math.max(a.w,a.h)));

  if(shuffleMode!=="none"){
    const seed = shuffleMode==="seed1"?1:shuffleMode==="seed2"?2:3;
    items = shuffle(items, seed);
  }

  let sheets=[];
  let currentSheet = {rects:[], w:sheetW, h:sheetH};
  sheets.push(currentSheet);

  let x=0, y=0, rowMaxH=0;
  function newRow(){
    x=0;
    y += rowMaxH + kerf;
    rowMaxH=0;
  }

  for(const it of items){
    if(x>0 && x+it.w+kerf > sheetW){
      newRow();
    }
    if(y + it.h > sheetH){
      currentSheet = {rects:[], w:sheetW, h:sheetH};
      sheets.push(currentSheet);
      x=0; y=0; rowMaxH=0;
    }
    currentSheet.rects.push({
      name: it.name,
      x, y, w:it.w, h:it.h
    });
    x += it.w + kerf;
    if(it.h > rowMaxH) rowMaxH=it.h;
  }

  return {sheets, workW:sheetW, workH:sheetH};
}

// -----------------------------------------------------------------
// 統計計算（修正版：実配置面積を使用）
// -----------------------------------------------------------------
function calcStats(result, parts){
  const {sheets, workW, workH} = result;
  const totalSheetArea = sheets.length * (workW * workH);

  const placedArea = sheets.reduce(
    (acc, sh) => acc + sh.rects.reduce((a,r)=>a + r.w*r.h,0), 0
  );

  const partsArea = parts.reduce((a,p)=> a + p.w*p.h*p.qty, 0);

  const waste = Math.max(0, totalSheetArea - placedArea);
  const util = totalSheetArea>0 ? (placedArea / totalSheetArea * 100) : 0;

  return { sheetsCount: sheets.length, partsArea, placedArea, waste, util };
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function renderSheets(result){
  const {sheets, workW, workH} = result;
  let html="";
  sheets.forEach((sh, idx)=>{
    html+=`<div class="sheetBox">
      <div style="padding:4px;font-weight:bold;">シート #${idx+1}</div>
      <svg width="${workW}" height="${workH}" style="border:1px solid #000;background:#eee;">`;
    sh.rects.forEach(r=>{
      html+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
         fill="#cce" stroke="#33f" stroke-width="2" />
         <text class="rectLabel" x="${r.x+4}" y="${r.y+14}">
           ${escapeHtml(r.name)} (${r.w}×${r.h})
         </text>`;
    });
    html+=`</svg></div>`;
  });
  return html;
}

// -----------------------------------------------------------------
// 統計表示
// -----------------------------------------------------------------
function renderStats(stats){
  return `<div class="statsBox">
    <h3>統計</h3>
    <div>使用シート数：${stats.sheetsCount}</div>
    <div>要求部材総面積：${stats.partsArea} mm²</div>
    <div>配置された面積：${stats.placedArea} mm²</div>
    <div>廃材面積：${stats.waste} mm²</div>
    <div>利用率：${stats.util.toFixed(2)}%</div>
  </div>`;
}

// -----------------------------------------------------------------
// PDF 出力（フォントサイズ自動調整）
// -----------------------------------------------------------------
function printPDF(result){
  const w = result.workW;
  const h = result.workH;
  const pages = result.sheets.length;

  let html = `
  <html><head>
  <style>
  @page { size: A4 landscape; margin: 10mm; }
  body{ font-family: sans-serif; }
  svg{ border:1px solid #000; background:#eee; }
  </style>
  </head><body>
  `;

  result.sheets.forEach((sh, i)=>{
    html+=`<h2>シート #${i+1}</h2>`;
    html+=`<svg width="${w}" height="${h}">`;
    sh.rects.forEach(r=>{
      html+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
         fill="#cce" stroke="#33f" stroke-width="2" />`;
      const fs = Math.max(10, Math.min(40, r.w/5));
      html+=`<text x="${r.x+4}" y="${r.y+fs}" font-size="${fs}">
        ${escapeHtml(r.name)} (${r.w}×${r.h})
      </text>`;
    });
    html+=`</svg><div style="page-break-after:always;"></div>`;
  });

  html += `</body></html>`;

  const win = window.open("");
  win.document.write(html);
  win.document.close();
  win.focus();
  win.print();
}

// -----------------------------------------------------------------
// イベント
// -----------------------------------------------------------------
document.getElementById("calcBtn").addEventListener("click", ()=>{
  const parts = parseCSV(document.getElementById("csvInput").value);
  const sheetW = Number(document.getElementById("sheetW").value);
  const sheetH = Number(document.getElementById("sheetH").value);
  const kerf   = Number(document.getElementById("kerf").value);
  const shuf   = document.getElementById("shuffleMode").value;

  const result = planLayout(parts, sheetW, sheetH, kerf, shuf);
  const stats  = calcStats(result, parts);

  document.getElementById("resultArea").innerHTML = renderSheets(result);
  document.getElementById("statsArea").innerHTML  = renderStats(stats);
});

document.getElementById("pdfBtn").addEventListener("click", ()=>{
  const parts = parseCSV(document.getElementById("csvInput").value);
  const sheetW = Number(document.getElementById("sheetW").value);
  const sheetH = Number(document.getElementById("sheetH").value);
  const kerf   = Number(document.getElementById("kerf").value);
  const shuf   = document.getElementById("shuffleMode").value;

  const result = planLayout(parts, sheetW, sheetH, kerf, shuf);
  printPDF(result);
});
</script>

</body>
</html>
