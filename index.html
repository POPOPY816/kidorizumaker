<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木取り計算（安定版）</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
}
textarea { width: 100%; height: 140px; }
button { padding: 6px 12px; margin-top: 8px; }

.sheet {
  margin-top: 20px;
  border: 2px solid #333;
  display: inline-block;
}
</style>
</head>
<body>

<h2>木取り計算（安定版）</h2>

<div>
  板サイズ：
  <input id="w" type="number" value="910"> ×
  <input id="h" type="number" value="1820"> mm
</div>

<div>
  <textarea id="csv">
A,200,300,2
B,450,300,1
C,300,200,3
  </textarea>
</div>

<button onclick="calc()">計算</button>
<button onclick="pdf()">PDF出力</button>

<div id="view"></div>

<script>
function parseCSV(t){
  return t.trim().split(/\n/).map(l=>{
    const [n,w,h,q]=l.split(",");
    return {name:n,w:+w,h:+h,q:+q};
  });
}

function layout(parts,W,H){
  let items=[];
  parts.forEach(p=>{
    for(let i=0;i<p.q;i++) items.push({...p});
  });

  let sheets=[[]];
  let x=0,y=0,row=0;

  for(const p of items){
    if(x+p.w>W){
      x=0;
      y+=row;
      row=0;
    }
    if(y+p.h>H){
      sheets.push([]);
      x=0;y=0;row=0;
    }
    sheets.at(-1).push({...p,x,y});
    x+=p.w;
    row=Math.max(row,p.h);
  }
  return sheets;
}

function draw(sheets,W,H){
  return sheets.map((s,i)=>`
    <div class="sheet">
      <svg width="${W}" height="${H}">
        ${s.map(r=>`
          <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
            fill="#cce" stroke="#000"/>
          <text x="${r.x+4}" y="${r.y+14}" font-size="12">
            ${r.name}
          </text>
        `).join("")}
      </svg>
    </div>
  `).join("");
}

function calc(){
  const W=+w.value, H=+h.value;
  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H);
  view.innerHTML = draw(sheets,W,H);
}

function pdf(){
  const W=+w.value, H=+h.value;
  const parts=parseCSV(csv.value);
  const sheets=layout(parts,W,H);

  let html=`
  <html><head>
  <style>
    @page { size: A4 landscape; margin:0; }
    body { margin:0; }
    .page {
      width:297mm;
      height:210mm;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    svg {
      width:210mm;
      height:297mm;
      transform:rotate(90deg);
      border:1px solid #000;
    }
  </style>
  </head><body>
  `;

  sheets.forEach(s=>{
    html+=`
      <div class="page">
        <svg viewBox="0 0 ${W} ${H}">
          ${s.map(r=>`
            <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
              fill="#cce" stroke="#000"/>
            <text x="${r.x+4}" y="${r.y+14}" font-size="14">${r.name}</text>
          `).join("")}
        </svg>
      </div>`;
  });

  html+=`</body></html>`;

  const win=window.open();
  win.document.write(html);
  win.document.close();
  win.print();
}
</script>
</body>
</html>
