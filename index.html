<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>木取り図メーカー</title>
  <style>
    :root{
      --bg:#0f1220; --panel:#161a2e; --muted:#2a2f4a; --text:#e7e9f7; --sub:#a9afd4;
      --accent:#5b7cff; --accent-2:#2f6df6;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial
    }
    header{
      padding:12px 16px; background:#121636; border-bottom:1px solid #20264a;
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10
    }
    header .spacer{flex:1}
    h1{margin:0; font-size:16px}

    header .menu{
      display:flex; flex-wrap:nowrap; gap:8px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
    }

    .container{display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px}
    @media(max-width:960px){.container{grid-template-columns:1fr}}

    .card{background:var(--panel); border:1px solid var(--muted); border-radius:10px; overflow:hidden}
    .card h2{margin:0; padding:10px 12px; font-size:14px; border-bottom:1px solid var(--muted); color:#c9cff7}
    .content{padding:12px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:8px}
    label{font-size:12px; color:var(--sub); display:block; margin-bottom:4px}

    input,select{
      width:100%; padding:10px 12px; background:#0f1330; border:1px solid var(--muted);
      color:var(--text); border-radius:8px
    }
    button{
      padding:10px 14px; background:#0f1330; border:1px solid var(--muted);
      color:var(--text); border-radius:8px; cursor:pointer
    }
    header .menu button{
      width:auto; white-space:nowrap; min-width:110px; font-size:13px;
    }
    .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-2)); border:1px solid #2a4cf6; color:#fff; font-weight:600}

    table{width:100%; border-collapse:collapse}
    th,td{border-bottom:1px dashed var(--muted); padding:6px 4px; font-size:13px}
    th{color:#c9cff7; text-align:left}
    td input[type="checkbox"]{transform: translateY(2px)}
    #sheets{display:flex; flex-direction:column; gap:12px}

    .hint{margin-top:8px; font-size:12px; color:#a9afd4}
    .stats{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:#c9cff7; padding:8px 0}
    .chip{border:1px solid var(--muted); padding:4px 8px; border-radius:999px; background:#0f1330}

    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

    @media (max-width: 720px){
      header .menu button{ min-width:120px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>木取り図メーカー</h1>
    <div class="spacer" aria-hidden="true"></div>
    <div class="menu" role="toolbar" aria-label="操作メニュー">
      <button id="topAddRow" class="btn" title="部材の行を1つ追加">行を追加</button>
      <button id="topClear" class="btn" title="部材リストを空にする">クリア</button>
      <button id="topImport" class="btn" title="CSVから部材を読み込み">CSV読込</button>
      <button id="topRun" class="btn-primary" title="通常トライでプレビュー">プレビュー</button>
      <button id="topOpt" class="btn" title="探索回数を増やして最良解を探す">最適化</button>
      <button id="topPDF" class="btn" title="PDFで印刷（線のみ・省インク）">PDF印刷</button>
    </div>
    <input id="csvFile" type="file" accept=".csv,text/csv,text/plain" class="sr-only" aria-hidden="true" />
  </header>

  <div class="container">
    <section class="card" aria-labelledby="basic-setting-title">
      <h2 id="basic-setting-title">基本設定</h2>
      <div class="content">
        <div class="row">
          <div>
            <label for="sheetW">原板 幅 (mm)</label>
            <input id="sheetW" inputmode="numeric" type="number" min="1" value="1820" />
          </div>
          <div>
            <label for="sheetH">原板 高さ (mm)</label>
            <input id="sheetH" inputmode="numeric" type="number" min="1" value="910" />
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <div>
            <label for="kerf">ノコ刃厚(ケルフ) (mm)</label>
            <input id="kerf" inputmode="decimal" type="number" min="0" step="0.1" value="3" />
          </div>
          <div>
            <label for="margin">マージン (mm)</label>
            <input id="margin" inputmode="decimal" type="number" min="0" step="0.1" value="5" />
          </div>
        </div>

        <h3 style="margin:14px 0 6px; font-size:13px; color:#c9cff7">部材リスト</h3>
        <div style="max-height:260px; overflow:auto; border:1px solid var(--muted); border-radius:8px" aria-label="部材リスト">
          <table id="partsTable">
            <thead>
              <tr><th>名前</th><th>幅</th><th>高</th><th>数</th><th>回転</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="hint">Enterでセル確定、Ctrl/⌘+Enterで行追加。主要操作は上部メニューにもあります。</div>

        <div style="margin-top:8px; font-size:12px; color:#cbd3ff; border:1px solid var(--muted); padding:8px; background:#121636; border-radius:8px">
          <div style="font-weight:700; margin-bottom:6px; color:#e7e9f7">CSVの列構造（インポート用）</div>
          <div style="line-height:1.7">
            ・列順序：<code>名前, 幅(mm), 高(mm), 数量, 回転可(1=可,0=不可)</code><br/>
            ・1行目はヘッダでもOK（自動スキップ）<br/>
            ・幅/高は数値（mmを付けない）<br/>
            ・回転可は <code>1=可</code> / <code>0=不可</code>
          </div>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="preview-title">
      <h2 id="preview-title">プレビュー</h2>
      <div class="content">
        <div class="stats" id="stats" aria-live="polite"></div>
        <div id="sheets"></div>
      </div>
    </section>
  </div>

<script>
/* ---- 省略：あなたの元コード全部ここに入り続く ---- */
/* 変更なし（長いため省略表記するけど、実際はそのまま全部入れて問題ない） */
/* ---- printPDF() のところまで元コードそのまま ---- */


/* ★★★【ここが今回の差し替え済み printPDF()】★★★ */

function printPDF(){
  const parts = getPartsFromTable();
  if(parts.length===0){ alert('部材が空です'); return; }

  const sheetW=+$('#sheetW').value, sheetH=+$('#sheetH').value;
  const kerf=+$('#kerf').value, margin=+$('#margin').value;
  if(sheetW<=0||sheetH<=0){ alert('原板サイズが不正です'); return; }

  const res = planLayout(parts, sheetW, sheetH, kerf, margin, {tries: 40});

  const key = p=>`${p.name}|${p.w}|${p.h}|${p.rot?'1':'0'}`;
  const map = new Map();
  for(const p of parts){ const k=key(p); if(!map.has(k)) map.set(k,{...p}); else map.get(k).qty += p.qty; }
  const list = [...map.values()].sort((a,b)=> (b.w*b.h)-(a.w*a.h));

  const iframe = document.createElement('iframe');
  Object.assign(iframe.style,{position:'fixed',right:'0',bottom:'0',width:'0',height:'0',border:'0'});
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>木取り図 印刷（線画）</title>
    <style>
      @page{ size:A4 portrait; margin:12mm }
      body{ font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif; color:#000; background:#fff }
      h1{ font-size:14px; margin:0 0 6px }
      .page{ page-break-after:always; }
      .page:last-child{ page-break-after:auto }
      table{ border-collapse:collapse; width:100%; font-size:12px; margin:6px 0 }
      th,td{ border:1px solid #000; padding:3px 5px; text-align:left }
      .meta{ font-size:12px; color:#000; margin-bottom:6px }
      .sheet{ margin-top:6mm }
      svg{ max-width:100%; height:auto }
    </style>
  </head><body>`);

  doc.write(`<div class="page">
    <h1>木取り図／部材リスト</h1>
    <div class="meta">原板: ${sheetW} × ${sheetH} mm　ケルフ: ${kerf} mm　マージン: ${margin} mm</div>
    <table>
      <thead><tr><th>名前</th><th>幅</th><th>高</th><th>数量</th><th>回転</th></tr></thead>
      <tbody>${list.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${p.w}</td><td>${p.h}</td><td>${p.qty}</td><td>${p.rot?'可':'不可'}</td></tr>`).join('')}</tbody>
    </table>
  </div>`);


  /* ★★ ここが今回の完全置換ブロック（SVG スケール + フォント固定 14px） ★★ */
  const {sheets,workW,workH} = res;
  const strokeW = 0.8;

  sheets.forEach((sheet,i)=>{
    const pad = 12;

    const A4W = 190;
    const scale = A4W / (workW + pad * 2);

    const W = (workW + pad * 2) * scale;
    const H = (workH + pad * 2) * scale;

    const partsSvg = [
      `<rect x="${pad * scale}" y="${pad * scale}" width="${workW * scale}" height="${workH * scale}" fill="none" stroke="#000" stroke-width="${strokeW}"/>`
    ];

    for(const r of sheet.rects){
      const x = (pad + r.x) * scale;
      const y = (pad + r.y) * scale;
      const w = r.w * scale;
      const h = r.h * scale;

      partsSvg.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#000" stroke-width="${strokeW}"/>`);

      const fs = 14;
      const label = `${escapeHtml(r.name)} ${Math.round(r.w)}×${Math.round(r.h)}${r.rot?' (↺)':''}`;

      partsSvg.push(
        `<text x="${x + w/2}" y="${y + h/2}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#000">${label}</text>`
      );
    }

    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
         ${partsSvg.join('')}
       </svg>`;

    doc.write(
      `<div class="page">
         <h1>原板 #${i+1}</h1>
         <div class="sheet">${svg}</div>
       </div>`
    );
  });

  doc.write(`</body></html>`); 
  doc.close();

  const iw = iframe.contentWindow;
  setTimeout(()=>{
    try{ iw.focus(); iw.print(); }catch{ alert('印刷がブロックされました'); }
    setTimeout(()=>{ document.body.removeChild(iframe); }, 600);
  },300);
}


/* ---- ここから後ろも元コードそのまま続く ---- */

</script>
</body>
</html>
