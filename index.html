<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>木取り最適化（完成版）</title>
<style>
body { font-family: "Yu Gothic","Meiryo",sans-serif; margin:20px; }
textarea { width:100%; height:140px; }
button { padding:6px 12px; margin-top:8px; }
.sheet { margin:20px 0; border:2px solid #000; padding:10px; }
.preview svg { width:100%; max-width:900px; border:1px solid #000; }
.info { margin-bottom:6px; font-size:14px; }
</style>
</head>
<body>

<h2>木取り計算（最終版）</h2>

<div>
板サイズ：
<input id="w" type="number" value="1820"> ×
<input id="h" type="number" value="910"> mm
</div>

<textarea id="csv">
背板,474,374,2
側板,450,276,2
天板,350,276,2
補強,350,252,2
縦桟,450,30,3
</textarea>

<br>
<button onclick="calc()">計算</button>
<button onclick="pdf()">PDF</button>

<div id="view"></div>

<script>
const MARGIN = 10;
const KERF = 4;
const TRY_COUNT = 12;

// ---------- CSV ----------
function parseCSV(text){
  return text.trim().split(/\n/).map(l=>{
    const p=l.split(",");
    return {name:p[0],w:+p[1],h:+p[2],q:+p[3]};
  });
}

// ---------- メイン ----------
function solve(parts,W,H){
  let best=null;

  for(let t=0;t<TRY_COUNT;t++){
    const result = layout(parts,W,H,t);
    if(!best || result.score > best.score){
      best = result;
    }
  }
  return best;
}

// ---------- 配置 ----------
function layout(parts,W,H,seed){
  const usableW=W-MARGIN*2;
  const usableH=H-MARGIN*2;

  let items=[];
  parts.forEach(p=>{
    for(let i=0;i<p.q;i++) items.push({...p});
  });

  // 高さクラスタ + ランダム性
  items.sort((a,b)=>{
    const ha = Math.round(a.h/50);
    const hb = Math.round(b.h/50);
    if(ha!==hb) return hb-ha;
    return (b.w*b.h)-(a.w*a.h)+(Math.random()-0.5)*seed*50;
  });

  let free=[{x:MARGIN,y:MARGIN,w:usableW,h:usableH}];
  let placed=[];

  for(const p of items){
    let best=null;

    for(const r of free){
      for(const rot of [false,true]){
        const pw=rot?p.h:p.w;
        const ph=rot?p.w:p.h;
        if(pw>r.w||ph>r.h) continue;

        const heightGap=Math.abs(r.h-ph);
        const widthGap=Math.abs(r.w-pw);
        const waste=(r.w*r.h)-(pw*ph);

        const score =
          -heightGap*5
          -widthGap*2
          -waste*0.01;

        if(!best||score>best.score){
          best={r,pw,ph,rot,score};
        }
      }
    }

    if(!best) continue;

    const r=best.r;
    placed.push({
      name:p.name,
      x:r.x,y:r.y,
      w:best.pw,h:best.ph,
      rot:best.rot
    });

    const right={
      x:r.x+best.pw+KERF,
      y:r.y,
      w:r.w-best.pw-KERF,
      h:best.ph
    };
    const bottom={
      x:r.x,
      y:r.y+best.ph+KERF,
      w:r.w,
      h:r.h-best.ph-KERF
    };

    free=free.filter(f=>f!==r);
    if(right.w>30&&right.h>30) free.push(right);
    if(bottom.w>30&&bottom.h>30) free.push(bottom);
  }

  const area=(W-MARGIN*2)*(H-MARGIN*2);
  const used=placed.reduce((s,r)=>s+r.w*r.h,0);
  const rate=Math.round(used/area*100);

  return {placed,score:rate,rate};
}

// ---------- 描画 ----------
function draw(res,W,H){
  return `
  <div class="sheet">
    <div class="info">使用率 ${res.rate}%</div>
    <svg viewBox="0 0 ${W} ${H}">
      <rect width="${W}" height="${H}" fill="none" stroke="black"/>
      ${res.placed.map(r=>`
        <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"
          fill="#eee" stroke="black"/>
        <text x="${r.x+6}" y="${r.y+16}" font-size="13">
          ${r.name}${r.rot?"(回転)":""}
        </text>
        <text x="${r.x+6}" y="${r.y+32}" font-size="12">
          ${r.w}×${r.h}
        </text>
      `).join("")}
    </svg>
  </div>`;
}

function calc(){
  const W=+w.value;
  const H=+h.value;
  const parts=parseCSV(csv.value);
  const best=solve(parts,W,H);
  view.innerHTML=draw(best,W,H);
}

// ---------- PDF ----------
function pdf(){
  const W=+w.value;
  const H=+h.value;
  const parts=parseCSV(csv.value);
  const best=solve(parts,W,H);

  let html=`<html><head>
  <style>
  @page{size:A4 landscape;margin:10mm;}
  body{font-family:sans-serif;}
  </style>
  </head><body>
  <svg width="277mm" height="190mm" viewBox="0 0 ${W} ${H}">
  <rect width="${W}" height="${H}" fill="none" stroke="black"/>
  ${best.placed.map(r=>`
    <rect x="${r.x}" y="${r.y}"
      width="${r.w}" height="${r.h}"
      fill="#eee" stroke="black"/>
    <text x="${r.x+6}" y="${r.y+16}" font-size="14">
      ${r.name}
    </text>
  `).join("")}
  </svg>
  </body></html>`;

  const win=window.open();
  win.document.write(html);
  win.document.close();
  win.print();
}
</script>
</body>
</html>
