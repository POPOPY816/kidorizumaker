<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木取り図メーカー（修正版）</title>
<style>
:root{--bg:#0f1220;--panel:#161a2e;--muted:#2a2f4a;--text:#e7e9f7;--sub:#a9afd4;--accent:#5b7cff;--accent-2:#2f6df6}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Meiryo",system-ui}
header{padding:12px 16px;background:#121636;border-bottom:1px solid #20264a;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .spacer{flex:1}h1{margin:0;font-size:16px}
header .menu{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.container{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px}
@media(max-width:960px){.container{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--muted);border-radius:10px;overflow:hidden}
.card h2{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--muted);color:#c9cff7}
.content{padding:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
input{width:100%;padding:10px 12px;background:#0f1330;border:1px solid var(--muted);color:var(--text);border-radius:8px}
button{padding:10px 14px;background:#0f1330;border:1px solid var(--muted);color:var(--text);border-radius:8px;cursor:pointer}
header .menu button{width:auto;white-space:nowrap;min-width:110px;font-size:13px}
.btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border:1px solid #2a4cf6;color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px dashed var(--muted);padding:6px 4px;font-size:13px}
th{color:#c9cff7;text-align:left}
td input[type="checkbox"]{transform: translateY(2px)}
#sheets{overflow:auto}
.sheet{position:relative;margin-bottom:16px;background:#1a1f36;border:1px solid var(--sub)}
.part{position:absolute;box-sizing:border-box;border:1px solid #5b7cff;background:rgba(91,124,255,0.5);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
</style>
</head>
<body>
<header>
<h1>木取り図メーカー（修正版）</h1>
<div class="spacer"></div>
<div class="menu">
<button id="topAddRow">行を追加</button>
<button id="topClear">クリア</button>
<button id="topRun" class="btn-primary">プレビュー</button>
</div>
</header>

<div class="container">
<section class="card">
<h2>基本設定</h2>
<div class="content">
<div class="row">
<div><label>原板 幅 (mm)</label><input id="sheetW" type="number" value="1820"></div>
<div><label>原板 高さ (mm)</label><input id="sheetH" type="number" value="910"></div>
</div>
<div class="row" style="margin-top:8px">
<div><label>ノコ刃厚 (mm)</label><input id="kerf" type="number" step="0.1" value="3"></div>
<div><label>マージン (mm)</label><input id="margin" type="number" step="0.1" value="5"></div>
</div>

<h3 style="margin:14px 0 6px;font-size:13px;color:#c9cff7">部材リスト</h3>
<div style="max-height:260px;overflow:auto;border:1px solid var(--muted);border-radius:8px">
<table id="partsTable">
<thead><tr><th>名前</th><th>幅</th><th>高</th><th>数</th><th>回転</th><th></th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class="hint">Enterでセル確定、Ctrl/⌘+Enterで行追加。</div>
</div>
</section>

<section class="card">
<h2>プレビュー</h2>
<div class="content">
<div class="stats" id="stats"></div>
<div id="sheets"></div>
</div>
</section>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];

function addRow(pref={name:'',w:100,h:100,qty:1,rot:true}){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input class="name" value="${pref.name}"></td>
  <td><input class="w" type="number" min="1" value="${pref.w}"></td>
  <td><input class="h" type="number" min="1" value="${pref.h}"></td>
  <td><input class="qty" type="number" min="1" value="${pref.qty}"></td>
  <td style="text-align:center"><input class="rot" type="checkbox" ${pref.rot?'checked':''}></td>
  <td><button class="del">削除</button></td>`;
  $('#partsTable tbody').appendChild(tr);
  $('.del',tr).addEventListener('click',()=>tr.remove());
  $$('input',tr).forEach(inp=>inp.addEventListener('change',()=>clampInputs(tr)));
}

function clampInputs(tr){
  const w=$('.w',tr),h=$('.h',tr),q=$('.qty',tr);
  w.value=Math.max(1,Math.floor(+w.value||0));
  h.value=Math.max(1,Math.floor(+h.value||0));
  q.value=Math.max(1,Math.floor(+q.value||1));
}

function getParts(){
  return $$('#partsTable tbody tr').flatMap(tr=>{
    const name=$('.name',tr).value.trim();
    const w=+$('.w',tr).value;
    const h=+$('.h',tr).value;
    const qty=+$('.qty',tr).value;
    const rot=$('.rot',tr).checked;
    const arr=[];
    for(let i=0;i<qty;i++) arr.push({name,w,h,rot});
    return arr;
  }).filter(p=>p.w>0&&p.h>0);
}

// パッキング（簡易ヒューリスティック）
function planLayout(parts,sheetW,sheetH,kerf,margin){
  const sheets=[{parts:[],width:sheetW,height:sheetH}];
  for(const part of parts){
    let placed=false;
    for(const sheet of sheets){
      const pos=findPosition(sheet,part,kerf,margin);
      if(pos){sheet.parts.push({...part,...pos});placed=true;break;}
    }
    if(!placed){
      const newSheet={parts:[],width:sheetW,height:sheetH};
      const pos=findPosition(newSheet,part,kerf,margin);
      if(pos) newSheet.parts.push({...part,...pos});
      sheets.push(newSheet);
    }
  }
  return sheets;
}

function findPosition(sheet,part,kerf,margin){
  const step=5;
  const maxX=sheet.width-part.w-margin;
  const maxY=sheet.height-part.h-margin;
  for(let y=margin;y<=maxY;y+=step){
    for(let x=margin;x<=maxX;x+=step){
      const rect={x,y,w:part.w,h:part.h};
      if(!overlapsAny(rect,sheet.parts,kerf)) return rect;
      if(part.rot){
        const rect2={x,y,w:part.h,h:part.w};
        if(x+part.h+margin<=sheet.width && y+part.w+margin<=sheet.height)
          if(!overlapsAny(rect2,sheet.parts,kerf)) return rect2;
      }
    }
  }
  return null;
}

function overlapsAny(rect,parts,kerf){
  for(const p of parts) if(rectanglesOverlap(rect,p,kerf)) return true;
  return false;
}

function rectanglesOverlap(a,b,kerf){
  return !(a.x+a.w+kerf<=b.x || b.x+b.w+kerf<=a.x || a.y+a.h+kerf<=b.y || b.y+b.h+kerf<=a.y);
}

function renderSheets(sheets){
  const container=$('#sheets'); container.innerHTML='';
  const sheetW=+$('#sheetW').value,sheetH=+$('#sheetH').value;
  const scale=Math.min(500/sheetW,300/sheetH);
  for(const sheet of sheets){
    const div=document.createElement('div');
    div.className='sheet'; div.style.width=(sheetW*scale)+'px'; div.style.height=(sheetH*scale)+'px';
    container.appendChild(div);
    for(const part of sheet.parts){
      const pdiv=document.createElement('div');
      pdiv.className='part';
      pdiv.style.left=(part.x*scale)+'px';
      pdiv.style.top=(part.y*scale)+'px';
      pdiv.style.width=(part.w*scale)+'px';
      pdiv.style.height=(part.h*scale)+'px';
      pdiv.textContent=part.name;
      div.appendChild(pdiv);
    }
  }
}

function calcStats(sheets){
  let usedArea=0,totalArea=0;
  sheets.forEach(s=>{totalArea+=s.width*s.height;s.parts.forEach(p=>usedArea+=p.w*p.h)});
  return {sheetCount:sheets.length, utilization:(usedArea/totalArea*100).toFixed(1)+'%'};
}

function run(){
  const parts=getParts();
  const sheetW=+$('#sheetW').value;
  const sheetH=+$('#sheetH').value;
  const kerf=+$('#kerf').value;
  const margin=+$('#margin').value;
  const sheets=planLayout(parts,sheetW,sheetH,kerf,margin);
  renderSheets(sheets);
  const st=calcStats(sheets);
  $('#stats').textContent=`板数: ${st.sheetCount} / 利用率: ${st.utilization}`;
}

// 初期データ
addRow({name:'棚板A',w:300,h:200,qty:2,rot:true});

// ボタン
$('#topAddRow').addEventListener('click',()=>addRow());
$('#topClear').addEventListener('click',()=>{$('#partsTable tbody').innerHTML=''; run();});
$('#topRun').addEventListener('click',run);

run();
</script>
</body>
</html>
